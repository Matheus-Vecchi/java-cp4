<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Editar Produto</title>
</head>

<body>

<h1>Editar produto</h1>

<form th:action="@{/itens/{id}/editar(id=${item.id})}" method="post">

    <input type="hidden" name="_method" value="put">

    <div>
        <label for="nome">Nome:</label>
        <input
                type="text"
                id="nome"
                name="nome"
                th:value="${item.nome}">
    </div>

    <div>
        <label for="tipo">Tipo:</label>
        <input
                type="text"
                id="tipo"
                name="tipo"
                th:value="${item.tipo}">
    </div>

    <div>
        <label for="setor">Setor:</label>
        <input
                type="text"
                id="setor"
                name="setor"
                th:value="${item.setor}">
    </div>

    <div>
        <label for="tamanho">Tamanho:</label>
        <input
                type="text"
                id="tamanho"
                name="tamanho"
                th:value="${item.tamanho}">
    </div>

    <div>
        <label for="preco">Preço:</label>
        <input
                type="number"
                step="0.01"
                id="preco"
                name="preco"
                th:value="${item.preco}">
    </div>

    <button type="submit">
        Salvar alterações
    </button>

</form>

<br>

<a th:href="@{/itens}">
    Voltar para a lista
</a>

</body>

</html>
